name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare Firebase service account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FISHLLE_STOCK_MOGYA }}' > "$RUNNER_TEMP/firebase-service-account.json"
      - name: Deploy Firestore rules and indexes
        run: npm run deploy:firestore -- --project fishlle-stock-mogya
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
      - name: Cleanup Firebase service account file
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FISHLLE_STOCK_MOGYA }}
          channelId: live
          projectId: fishlle-stock-mogya
