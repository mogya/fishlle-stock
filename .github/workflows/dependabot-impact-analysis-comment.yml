name: Post Dependabot Impact Analysis

on:
  workflow_run:
    workflows:
      - Dependabot Impact Analysis
    types:
      - completed

jobs:
  post-comment:
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event != 'workflow_dispatch' || github.event.workflow_run.head_branch == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest

    permissions:
      actions: read
      pull-requests: write

    steps:
      - name: Download analysis artifact
        uses: actions/download-artifact@v4
        with:
          name: dependabot-impact-analysis-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/dependabot-impact-analysis
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate target pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          workflow_path="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.path')"
          if [[ "$workflow_path" != ".github/workflows/dependabot-impact-analysis.yml" ]]; then
            echo "Unexpected source workflow: $workflow_path" >&2
            exit 1
          fi

          pr_number="$(cat "$RUNNER_TEMP/dependabot-impact-analysis/pr_number")"
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "Invalid pull request number in analysis artifact" >&2
            exit 1
          fi

          artifact_event="$(cat "$RUNNER_TEMP/dependabot-impact-analysis/source_event")"
          if [[ "$artifact_event" != "$SOURCE_EVENT" ]]; then
            echo "Artifact event does not match the workflow run" >&2
            exit 1
          fi

          if [[ "$SOURCE_EVENT" != "pull_request_target" && "$SOURCE_EVENT" != "workflow_dispatch" ]]; then
            echo "Unexpected source event: $SOURCE_EVENT" >&2
            exit 1
          fi

          pr_state="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
          if [[ "$pr_state" != "OPEN" ]]; then
            echo "Pull request $pr_number is not open" >&2
            exit 1
          fi

          if [[ "$SOURCE_EVENT" == "pull_request_target" ]]; then
            pr_author="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json author --jq '.author.login')"
            if [[ "$pr_author" != "dependabot[bot]" ]]; then
              echo "Pull request $pr_number was not opened by Dependabot" >&2
              exit 1
            fi
          fi

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Post analysis comment to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          {
            echo "<!-- dependabot-impact-analysis -->"
            echo "> [!NOTE]"
            echo "> この分析は GitHub Copilot CLI によって自動生成されました。"
            echo ""
            cat "$RUNNER_TEMP/dependabot-impact-analysis/analysis_result.md"
          } > "$RUNNER_TEMP/dependabot-impact-analysis/comment_body.md"

          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/dependabot-impact-analysis/comment_body.md"