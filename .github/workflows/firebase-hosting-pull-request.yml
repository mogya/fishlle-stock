# staging プロジェクトの preview チャンネルへ PR ごとに自動デプロイする。
# 本番プロジェクト(fishlle-stock-mogya)には一切書き込まない。
name: Deploy PR Preview to Staging

on: pull_request

# 同一 PR で新しい push があれば実行中のプレビューをキャンセルする
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# action-hosting-deploy が check run 作成と PR コメントを行うために必要
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_preview:
    # fork からの PR では secrets が使えないため同一リポジトリの PR に限定する
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_ENV: staging
      # 【セキュリティリスク（現時点では受け入れ可能と判断）】
      # 生の staging サービスアカウント鍵をファイルに書き出し、その状態で
      # PR 側で書き換え可能な `npm run deploy:firestore`(package.json のスクリプト)を実行している。
      # push 権限者が悪意あるPRを開く／アカウントが乗っ取られた場合、この鍵を
      # 外部へ持ち出され、staging の Firestore/Auth/Hosting 権限を保持され続ける恐れがある。
      # (fork からのPRは if 条件と secrets 非付与で除外済み。影響範囲は staging に限定。)
      # 個人リポジトリで push 権限者が本人のみのため現状は許容。collaborator 追加時などは
      # rules デプロイを main マージ時の別フローへ分離すること。
      - name: Prepare Firebase service account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FISHLLE_STOCK_MOGYA_STAGING }}' > "$RUNNER_TEMP/firebase-service-account.json"
      - name: Deploy Firestore rules and indexes to staging
        run: npm run deploy:firestore -- --project fishlle-stock-mogya-staging
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
      - name: Cleanup Firebase service account file
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FISHLLE_STOCK_MOGYA_STAGING }}
          projectId: fishlle-stock-mogya-staging
          expires: 7d
